<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111111" />
    <title translate="no">Bakarr</title>
    <script>
      // Apply the persisted theme before first paint to avoid a light/dark flash.
      (function () {
        try {
          var stored = localStorage.getItem("bakarr-ui-theme");
          var theme = stored === "dark" || stored === "light" ? stored : null;
          var resolved = theme
            ? theme
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          var root = document.documentElement;
          root.classList.add(resolved);
          root.style.colorScheme = resolved;
        } catch (e) {
          // localStorage unavailable (private mode / disabled) — default to light.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
